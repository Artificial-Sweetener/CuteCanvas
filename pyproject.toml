[tool.pytest.ini_options]
addopts = ["--basetemp=.pytest-tmp"]
pythonpath = [
  "packages/qpane/src",
  "packages/cutecanvas/src",
  "packages/ferrastra/src",
  "packages/qpane/examples",
  "packages/cutecanvas/examples",
  "packages/ferrastra/examples",
]
testpaths = [
  "packages/qpane/tests",
  "packages/cutecanvas/tests",
  "packages/ferrastra/tests",
  "tools/testing/tests",
]
markers = [
  "interactive_performance: isolate strict interactive latency probes from shared hardware contention",
  "performance: mark long-running performance benchmarks",
  "swap_benchmark: mark swap latency benchmarks",
]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
preview = true
src = [
  "packages/cutecanvas/src",
  "packages/cutecanvas/examples",
  "packages/cutecanvas/tests",
  "packages/ferrastra/src",
  "packages/ferrastra/tests",
  "packages/qpane/src",
  "packages/qpane/examples",
  "packages/qpane/tests",
]

[tool.ruff.lint]
extend-select = ["E3", "TID251"]

[tool.ruff.lint.isort]
detect-same-package = false
known-first-party = ["tools"]

[tool.ruff.lint.per-file-ignores]
"packages/qpane/src/qpane/__init__.py" = ["F822"]
"packages/qpane/src/qpane/rendering/__init__.py" = ["F822"]

# Block enum.StrEnum so contributors keep using the (str, Enum) pattern.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"enum.StrEnum" = { msg = "Use (str, Enum) for Python 3.10 support." }
