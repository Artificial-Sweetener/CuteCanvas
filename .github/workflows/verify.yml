name: Verify

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to verify
        required: false
        default: ""
        type: string
      qpane_version:
        description: Exact candidate QPane version for wheel verification
        required: false
        default: ""
        type: string
      cutecanvas_version:
        description: Exact candidate CuteCanvas version for wheel verification
        required: false
        default: ""
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_QPANE: ${{ inputs.qpane_version }}
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CUTECANVAS: ${{ inputs.cutecanvas_version }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            requirements-dev.txt
            packages/qpane/pyproject.toml
            packages/cutecanvas/pyproject.toml
            packages/ferrastra/pyproject.toml
            Cargo.lock

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain

      - name: Install development dependencies
        run: |
          python -m pip install --constraint constraints-tooling.txt pip
          python -m pip install -r requirements-dev.txt

      - name: Run hook-equivalent quality checks
        run: |
          python -m ruff check .
          python -m black --check .
          python tools/fix_encoding.py --check
          python tools/check_docstrings.py --check
          python tools/check_api_order.py
          python tools/check_consistency.py
          python tools/check_architecture.py
          python tools/check_ferrastra_operations.py
          python tools/check_ferrastra_ownership.py
          python tools/check_ferrastra_benchmarks.py
          python tools/add_license_headers.py --check
          python -m ruff check --config ruff-ferrastra.toml .
          python -m pyright -p pyright-ferrastraconfig.json

      - name: Confirm generated files are current
        run: git diff --exit-code

  tests:
    name: Tests (${{ matrix.platform }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            python: "3.10"
          - os: ubuntu-24.04
            platform: linux-x64
            python: "3.11"
          - os: ubuntu-24.04
            platform: linux-x64
            python: "3.12"
          - os: windows-2025
            platform: windows-x64
            python: "3.12"
          - os: macos-15
            platform: macos-arm64
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            requirements-dev.txt
            packages/qpane/pyproject.toml
            packages/cutecanvas/pyproject.toml
            packages/ferrastra/pyproject.toml
            Cargo.lock

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain

      - name: Install development dependencies
        run: |
          python -m pip install --constraint constraints-tooling.txt pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python tools/test.py ci

      - name: Run mounted CuteCanvas abuse profile
        env:
          PYTHONPATH: packages/cutecanvas/tests
        run: python -m cutecanvas_test_support.harness --profile ci --seed 20260716

      - name: Upload mounted QPane failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cutecanvas-abuse-${{ matrix.os }}-py${{ matrix.python }}
          path: qpane-abuse-artifacts
          if-no-files-found: ignore

  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain

      - name: Run native quality and test gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Run native dependency policy
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  ferrastra-wheel:
    name: Ferrastra wheel (${{ matrix.platform }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            python: "3.10"
          - os: ubuntu-24.04
            platform: linux-x64
            python: "3.11"
          - os: ubuntu-24.04
            platform: linux-x64
            python: "3.12"
          - os: ubuntu-24.04
            platform: linux-x64
            python: "3.13"
          - os: ubuntu-24.04
            platform: linux-x64
            python: "3.14"
          - os: windows-2025
            platform: windows-x64
            python: "3.14"
          - os: macos-15
            platform: macos-arm64
            python: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            requirements-dev.txt
            packages/ferrastra/pyproject.toml
            Cargo.lock

      - name: Install wheel verification tools
        run: |
          python -m pip install --constraint constraints-tooling.txt pip build

      - name: Build and verify the independent wheel
        run: python tools/verify_ferrastra_wheel.py

  python-wheels:
    name: QPane and CuteCanvas wheel integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            packages/qpane/pyproject.toml
            packages/cutecanvas/pyproject.toml

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install wheel verification tools
        run: |
          python -m pip install --constraint constraints-tooling.txt pip build

      - name: Verify the exact QPane and CuteCanvas wheel stack
        run: python -m tools.verify_python_wheels

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            requirements-dev.txt
            packages/qpane/pyproject.toml
            packages/cutecanvas/pyproject.toml
            packages/ferrastra/pyproject.toml
            Cargo.lock

      - name: Activate repository Rust toolchain
        run: rustup show active-toolchain

      - name: Install the resolved repository environment
        run: |
          python -m pip install --constraint constraints-tooling.txt pip
          python -m pip install -r requirements-dev.txt

      - name: Audit installed Python dependencies
        run: python -m pip_audit --local

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  gate:
    name: Gate
    if: always()
    needs:
      - quality
      - tests
      - rust
      - ferrastra-wheel
      - python-wheels
      - python-audit
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          FERRASTRA_WHEEL_RESULT: ${{ needs.ferrastra-wheel.result }}
          PYTHON_WHEELS_RESULT: ${{ needs.python-wheels.result }}
          PYTHON_AUDIT_RESULT: ${{ needs.python-audit.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$RUST_RESULT" = "success"
          test "$FERRASTRA_WHEEL_RESULT" = "success"
          test "$PYTHON_WHEELS_RESULT" = "success"
          test "$PYTHON_AUDIT_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success" || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
