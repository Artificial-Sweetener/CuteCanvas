name: Verify

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_VERSION: "26.1.2"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/qpane/pyproject.toml
            packages/cutecanvas/pyproject.toml

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install development dependencies
        run: |
          python -m pip install "pip==${{ env.PIP_VERSION }}"
          python -m pip install -r requirements-dev.txt

      - name: Run hook-equivalent quality checks
        run: |
          python -m ruff check --fix .
          python -m black .
          python tools/fix_encoding.py
          python tools/check_docstrings.py
          python tools/check_api_order.py
          python tools/check_consistency.py
          python tools/add_license_headers.py

      - name: Confirm generated files are current
        run: git diff --exit-code

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/qpane/pyproject.toml
            packages/cutecanvas/pyproject.toml

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install development dependencies
        run: |
          python -m pip install "pip==${{ env.PIP_VERSION }}"
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -n auto

      - name: Run mounted CuteCanvas abuse profile
        run: python -m tests.harness --profile ci --seed 20260716

      - name: Upload mounted QPane failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cutecanvas-abuse-${{ matrix.os }}-py${{ matrix.python }}
          path: qpane-abuse-artifacts
          if-no-files-found: ignore

  gate:
    name: Gate
    if: always()
    needs:
      - quality
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"
