name: Publish package to PyPI

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing product-prefixed tag to build and publish
        required: true
        type: string
      verified:
        description: Caller already completed the repository verification gate
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing product-prefixed tag to recover or republish
        required: true
        type: string
  push:
    tags:
      - "ferrastra-v*"
      - "qpane-v*"
      - "cutecanvas-v*"

permissions:
  contents: read
  id-token: write

env:
  PIP_VERSION: "26.1.2"
  BUILD_VERSION: "1.5.0"
  TWINE_VERSION: "7.0.0"
  README_RENDERER_VERSION: "45.0"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    if: inputs.verified != true
    uses: ./.github/workflows/verify.yml

  select:
    needs: verify
    if: >-
      always() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.product.outputs.package }}
      display_name: ${{ steps.product.outputs.display_name }}
      version: ${{ steps.product.outputs.version }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Select tagged package
        id: product
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            ferrastra-v*) package="ferrastra"; display_name="Ferrastra" ;;
            qpane-v*) package="qpane"; display_name="QPane" ;;
            cutecanvas-v*) package="cutecanvas"; display_name="CuteCanvas" ;;
            *) echo "Unsupported release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#*-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Python release admission
        if: steps.product.outputs.package != 'ferrastra'
        run: python tools/check_python_release.py "${{ env.RELEASE_TAG }}" --check-pypi

      - name: Validate Ferrastra release version
        if: steps.product.outputs.package == 'ferrastra'
        run: python tools/check_ferrastra_release_tag.py "${{ env.RELEASE_TAG }}"

  build-python:
    needs: select
    if: >-
      always() &&
      needs.select.result == 'success' &&
      needs.select.outputs.package != 'ferrastra'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build selected distribution
        run: |
          python -m pip install "pip==${{ env.PIP_VERSION }}" "build==${{ env.BUILD_VERSION }}" "twine==${{ env.TWINE_VERSION }}" "readme-renderer[md]==${{ env.README_RENDERER_VERSION }}"
          python -m build "packages/${{ needs.select.outputs.package }}"

      - name: Validate selected distribution
        run: |
          python -m twine check --strict "packages/${{ needs.select.outputs.package }}/dist/"*
          python tools/verify_python_release_artifacts.py "${{ env.RELEASE_TAG }}" "packages/${{ needs.select.outputs.package }}/dist"

      - name: Upload selected distribution
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ needs.select.outputs.package }}-${{ env.RELEASE_TAG }}
          path: packages/${{ needs.select.outputs.package }}/dist/*

  build-ferrastra:
    needs: select
    if: >-
      always() &&
      needs.select.result == 'success' &&
      needs.select.outputs.package == 'ferrastra'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build abi3 native wheel
        working-directory: packages/ferrastra
        run: |
          python -m pip install "pip==${{ env.PIP_VERSION }}" maturin==1.14.1
          python -m maturin build --release --out dist

      - name: Build Ferrastra source distribution
        if: runner.os == 'Linux'
        working-directory: packages/ferrastra
        run: python -m maturin sdist --out dist

      - name: Upload platform wheel
        uses: actions/upload-artifact@v6
        with:
          name: dist-ferrastra-${{ matrix.platform }}-${{ env.RELEASE_TAG }}
          path: packages/ferrastra/dist/*

  publish:
    if: >-
      always() &&
      needs.select.result == 'success' &&
      (needs.build-python.result == 'success' || needs.build-ferrastra.result == 'success')
    needs:
      - select
      - build-python
      - build-ferrastra
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.select.outputs.package }}/
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          pattern: dist-${{ needs.select.outputs.package }}-*${{ env.RELEASE_TAG }}
          path: dist/
          merge-multiple: true

      - name: Publish selected package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: false

  release-product:
    needs:
      - select
      - publish
    if: >-
      always() &&
      needs.select.result == 'success' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate package-scoped release notes
        run: python tools/generate_release_notes.py "${{ env.RELEASE_TAG }}" release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.select.outputs.display_name }} ${{ needs.select.outputs.version }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md
