name: Publish package to PyPI

on:
  push:
    tags:
      - "qpane-v*"
      - "cutecanvas-v*"

permissions:
  contents: read
  id-token: write

env:
  PIP_VERSION: "26.1.2"
  BUILD_VERSION: "1.5.0"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.product.outputs.package }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select tagged package
        id: product
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            qpane-v*) package="qpane" ;;
            cutecanvas-v*) package="cutecanvas" ;;
            *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build selected distribution
        run: |
          python -m pip install "pip==${{ env.PIP_VERSION }}" "build==${{ env.BUILD_VERSION }}"
          python -m build "packages/${{ steps.product.outputs.package }}"

      - name: Upload selected distribution
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ steps.product.outputs.package }}-${{ github.ref_name }}
          path: packages/${{ steps.product.outputs.package }}/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: dist-${{ needs.build.outputs.package }}-${{ github.ref_name }}
          path: dist/

      - name: Publish selected package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: false
