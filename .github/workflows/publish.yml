name: Publish sealed package to PyPI

run-name: Publish ${{ inputs.release_tag }} from ${{ inputs.recovery_id }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Product tag selected by the sealed plan
        required: true
        type: string
      orchestrator_run_id:
        description: Release run that owns the sealed plan and artifacts
        required: true
        type: string
      recovery_id:
        description: Identity of the exact sealed plan to resume
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

env:
  PIP_VERSION: "26.1.2"
  PACKAGING_VERSION: "26.3"
  RELEASE_TAG: ${{ inputs.release_tag }}
  ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
  RECOVERY_ID: ${{ inputs.recovery_id }}

jobs:
  admit:
    name: Admit sealed publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.product.outputs.package }}
      display_name: ${{ steps.product.outputs.display_name }}
      version: ${{ steps.product.outputs.version }}
      plan_id: ${{ steps.plan.outputs.plan_id }}
      upload_required: ${{ steps.admission.outputs.upload_required }}
    steps:
      - name: Check out exact product tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Select tagged product
        id: product
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            ferrastra-v*) package="ferrastra"; display_name="Ferrastra" ;;
            qpane-v*) package="qpane"; display_name="QPane" ;;
            cutecanvas-v*) package="cutecanvas"; display_name="CuteCanvas" ;;
            *) echo "Unsupported release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#*-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling runtime
        run: |
          python -m pip install "pip==${{ env.PIP_VERSION }}" "packaging==${{ env.PACKAGING_VERSION }}"

      - name: Confirm release-run ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.release_publications verify "$ORCHESTRATOR_RUN_ID" "$RECOVERY_ID"

      - name: Download sealed plan
        uses: actions/download-artifact@v7
        with:
          name: sealed-plan-${{ env.RECOVERY_ID }}
          path: plan
          run-id: ${{ env.ORCHESTRATOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate sealed plan identity
        id: plan
        shell: bash
        run: |
          plan_id="$(python -c "from pathlib import Path; from tools.release.plan import load_release_plan; plan=load_release_plan(Path('plan/sealed-release-plan.json')); assert plan.recovery_id == '$RECOVERY_ID'; print(plan.plan_id)")"
          echo "plan_id=$plan_id" >> "$GITHUB_OUTPUT"

      - name: Download native distribution
        if: steps.product.outputs.package == 'ferrastra'
        uses: actions/download-artifact@v7
        with:
          pattern: release-${{ steps.plan.outputs.plan_id }}-ferrastra-*
          path: distributions/ferrastra
          merge-multiple: true
          run-id: ${{ env.ORCHESTRATOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Python distribution
        if: steps.product.outputs.package != 'ferrastra'
        uses: actions/download-artifact@v7
        with:
          name: release-${{ steps.plan.outputs.plan_id }}-${{ steps.product.outputs.package }}
          path: distributions/${{ steps.product.outputs.package }}
          run-id: ${{ env.ORCHESTRATOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Admit exact bytes, lineage, dependencies, and PyPI state
        id: admission
        shell: bash
        run: python -m tools.admit_release_publication plan/sealed-release-plan.json "${{ steps.product.outputs.package }}" distributions --commit-sha "$(git rev-parse HEAD)" --release-tag "$RELEASE_TAG" --recovery-id "$RECOVERY_ID"

  publish:
    name: Publish immutable files
    needs: admit
    if: needs.admit.outputs.upload_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.admit.outputs.package }}/
    steps:
      - name: Download native distribution
        if: needs.admit.outputs.package == 'ferrastra'
        uses: actions/download-artifact@v7
        with:
          pattern: release-${{ needs.admit.outputs.plan_id }}-ferrastra-*
          path: distributions/ferrastra
          merge-multiple: true
          run-id: ${{ env.ORCHESTRATOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Python distribution
        if: needs.admit.outputs.package != 'ferrastra'
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.admit.outputs.plan_id }}-${{ needs.admit.outputs.package }}
          path: distributions/${{ needs.admit.outputs.package }}
          run-id: ${{ env.ORCHESTRATOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Publish absent files from the exact sealed distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: distributions/${{ needs.admit.outputs.package }}
          skip-existing: true

  verify-published:
    name: Verify live immutable release
    needs:
      - admit
      - publish
    if: >-
      always() &&
      needs.admit.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact product tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download sealed plan
        uses: actions/download-artifact@v7
        with:
          name: sealed-plan-${{ env.RECOVERY_ID }}
          path: plan
          run-id: ${{ env.ORCHESTRATOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download native distribution
        if: needs.admit.outputs.package == 'ferrastra'
        uses: actions/download-artifact@v7
        with:
          pattern: release-${{ needs.admit.outputs.plan_id }}-ferrastra-*
          path: distributions/ferrastra
          merge-multiple: true
          run-id: ${{ env.ORCHESTRATOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Python distribution
        if: needs.admit.outputs.package != 'ferrastra'
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.admit.outputs.plan_id }}-${{ needs.admit.outputs.package }}
          path: distributions/${{ needs.admit.outputs.package }}
          run-id: ${{ env.ORCHESTRATOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Require complete live PyPI state
        shell: bash
        run: |
          python -m pip install "pip==${{ env.PIP_VERSION }}" "packaging==${{ env.PACKAGING_VERSION }}"
          python -m tools.admit_release_publication plan/sealed-release-plan.json "${{ needs.admit.outputs.package }}" distributions --commit-sha "$(git rev-parse HEAD)" --release-tag "$RELEASE_TAG" --recovery-id "$RECOVERY_ID" | tee publication-receipt.txt
          grep "PyPI state complete" publication-receipt.txt

      - name: Persist publication receipt
        uses: actions/upload-artifact@v6
        with:
          name: publication-receipt-${{ env.RECOVERY_ID }}-${{ needs.admit.outputs.package }}
          path: publication-receipt.txt
          if-no-files-found: error
          retention-days: 30

  release-product:
    name: Create package-scoped GitHub release
    needs:
      - admit
      - verify-published
    if: needs.verify-published.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact product tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling runtime
        run: |
          python -m pip install "pip==${{ env.PIP_VERSION }}" "packaging==${{ env.PACKAGING_VERSION }}"

      - name: Generate package-scoped release notes
        run: python tools/generate_release_notes.py "$RELEASE_TAG" release-notes.md

      - name: Create GitHub release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.admit.outputs.display_name }} ${{ needs.admit.outputs.version }}
        shell: bash
        run: gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md
