name: Release changed products

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare immutable candidate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.plan.outputs.released }}
      plan_id: ${{ steps.plan.outputs.plan_id }}
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}
      candidate_ref: ${{ steps.candidate.outputs.candidate_ref }}
      python_matrix: ${{ steps.plan.outputs.python_matrix }}
      ferrastra_released: ${{ steps.plan.outputs.ferrastra_released }}
      ferrastra_version: ${{ steps.plan.outputs.ferrastra_version }}
      qpane_version: ${{ steps.plan.outputs.qpane_version }}
      cutecanvas_version: ${{ steps.plan.outputs.cutecanvas_version }}
    steps:
      - name: Check out the exact main source and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            requirements-dev.txt

      - name: Install the release planner
        run: |
          python -m pip install --constraint constraints-tooling.txt pip packaging python-semantic-release

      - name: Plan versions, synchronize manifests, and create local release commits
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "semantic-release"
          git config user.email "semantic-release@users.noreply.github.com"
          python -m tools.prepare_release --source-sha "${{ github.sha }}" --output "${{ runner.temp }}/release-plan.json"

      - name: Push reversible candidate lineage
        id: candidate
        if: steps.plan.outputs.released == 'true'
        shell: bash
        run: |
          candidate_ref="release-candidate/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$candidate_ref"
          echo "candidate_ref=$candidate_ref" >> "$GITHUB_OUTPUT"

      - name: Upload unsealed candidate plan
        if: steps.plan.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-plan-${{ steps.plan.outputs.plan_id }}
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify candidate
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ needs.prepare.outputs.candidate_sha }}
      qpane_version: ${{ needs.prepare.outputs.qpane_version }}
      cutecanvas_version: ${{ needs.prepare.outputs.cutecanvas_version }}
    secrets: inherit

  build-python:
    name: Build ${{ matrix.product }} candidate
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.prepare.outputs.python_matrix) }}
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_QPANE: ${{ needs.prepare.outputs.qpane_version }}
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CUTECANVAS: ${{ needs.prepare.outputs.cutecanvas_version }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            packages/${{ matrix.product }}/pyproject.toml

      - name: Build and check distribution
        run: |
          python -m pip install --constraint constraints-tooling.txt pip build twine "readme-renderer[md]"
          python -m build "packages/${{ matrix.product }}"
          python -m twine check --strict "packages/${{ matrix.product }}/dist/"*

      - name: Upload immutable candidate distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.prepare.outputs.plan_id }}-${{ matrix.product }}
          path: packages/${{ matrix.product }}/dist/*
          if-no-files-found: error
          retention-days: 30

  build-ferrastra:
    name: Build Ferrastra candidate (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.ferrastra_released == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            Cargo.lock

      - name: Build native candidate
        working-directory: packages/ferrastra
        run: |
          python -m pip install --constraint ../../constraints-tooling.txt pip maturin
          python -m maturin build --release --out dist

      - name: Build source distribution
        if: runner.os == 'Linux'
        working-directory: packages/ferrastra
        run: python -m maturin sdist --out dist

      - name: Upload immutable native distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.prepare.outputs.plan_id }}-ferrastra-${{ matrix.platform }}
          path: packages/ferrastra/dist/*
          if-no-files-found: error
          retention-days: 30

  candidate-gate:
    name: Candidate gate
    needs:
      - prepare
      - verify
      - build-python
      - build-ferrastra
    if: >-
      always() &&
      needs.prepare.outputs.released == 'true' &&
      needs.verify.result == 'success' &&
      needs.build-python.result == 'success' &&
      (needs.build-ferrastra.result == 'success' ||
      needs.build-ferrastra.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      recovery_id: ${{ steps.identity.outputs.recovery_id }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-tooling.txt
            requirements-dev.txt

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Download candidate plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-plan-${{ needs.prepare.outputs.plan_id }}
          path: plan

      - name: Download QPane candidate
        if: needs.prepare.outputs.qpane_version != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.prepare.outputs.plan_id }}-qpane
          path: distributions/qpane

      - name: Download CuteCanvas candidate
        if: needs.prepare.outputs.cutecanvas_version != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.prepare.outputs.plan_id }}-cutecanvas
          path: distributions/cutecanvas

      - name: Download Ferrastra candidates
        if: needs.prepare.outputs.ferrastra_released == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-${{ needs.prepare.outputs.plan_id }}-ferrastra-*
          path: distributions/ferrastra
          merge-multiple: true

      - name: Seal artifacts and prove clean resolver closure
        run: |
          python -m pip install --constraint constraints-tooling.txt pip packaging twine "readme-renderer[md]"
          python -m twine check --strict distributions/*/*
          python -m tools.manage_release_plan seal plan/release-plan.json distributions sealed-release-plan.json
          python -m tools.verify_release_closure sealed-release-plan.json distributions "${{ runner.temp }}/release-closure"

      - name: Derive sealed recovery identity
        id: identity
        shell: bash
        run: |
          recovery_id="$(python -c "from pathlib import Path; from tools.release.plan import load_release_plan; print(load_release_plan(Path('sealed-release-plan.json')).recovery_id)")"
          echo "recovery_id=$recovery_id" >> "$GITHUB_OUTPUT"

      - name: Upload sealed release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-plan-${{ steps.identity.outputs.recovery_id }}
          path: sealed-release-plan.json
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Finalize release lineage
    needs:
      - prepare
      - candidate-gate
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release tooling runtime
        run: |
          python -m pip install --constraint constraints-tooling.txt pip packaging

      - name: Download sealed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-plan-${{ needs.candidate-gate.outputs.recovery_id }}

      - name: Admit verified candidate status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${{ needs.prepare.outputs.candidate_sha }}" \
            -f state=success \
            -f context="verify / Gate" \
            -f description="Candidate passed the complete release gate"

      - name: Atomically push verified main and product tags
        run: python -m tools.manage_release_plan finalize sealed-release-plan.json

  publish-waterfall:
    name: Publish sealed waterfall
    needs:
      - prepare
      - candidate-gate
      - finalize
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out finalized release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release tooling runtime
        run: |
          python -m pip install --constraint constraints-tooling.txt pip packaging

      - name: Download sealed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-plan-${{ needs.candidate-gate.outputs.recovery_id }}

      - name: Publish each product in dependency order
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.release_publications dispatch sealed-release-plan.json

  cleanup-candidate:
    name: Remove reversible candidate branch
    needs:
      - prepare
      - finalize
      - publish-waterfall
    permissions:
      contents: write
    if: always() && needs.finalize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete finalized candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${{ needs.prepare.outputs.candidate_ref }}"
