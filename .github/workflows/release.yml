name: Release changed products

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  version-ferrastra:
    needs: verify
    uses: ./.github/workflows/version-product.yml
    with:
      product: ferrastra
      first_bump: "major"
      release_initial: true
      expected_head: ${{ github.sha }}
    secrets: inherit

  version-qpane:
    needs: version-ferrastra
    uses: ./.github/workflows/version-product.yml
    with:
      product: qpane
      first_bump: "major"
      release_initial: true
      legacy_anchor: "v2.1.1"
      cascade_patch: ${{ needs.version-ferrastra.outputs.released == 'true' }}
      expected_head: ${{ needs.version-ferrastra.outputs.head_sha }}
    secrets: inherit

  version-cutecanvas:
    needs: version-qpane
    uses: ./.github/workflows/version-product.yml
    with:
      product: cutecanvas
      first_bump: "major"
      release_initial: true
      cascade_patch: ${{ needs.version-qpane.outputs.released == 'true' }}
      expected_head: ${{ needs.version-qpane.outputs.head_sha }}
    secrets: inherit

  publish-waterfall:
    needs:
      - version-ferrastra
      - version-qpane
      - version-cutecanvas
    if: >-
      always() &&
      needs.version-ferrastra.result == 'success' &&
      needs.version-qpane.result == 'success' &&
      needs.version-cutecanvas.result == 'success' &&
      (needs.version-ferrastra.outputs.released == 'true' ||
      needs.version-qpane.outputs.released == 'true' ||
      needs.version-cutecanvas.outputs.released == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the versioned release lineage
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-cutecanvas.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish the versioned product waterfall
        env:
          GH_TOKEN: ${{ github.token }}
          FERRASTRA_RELEASED: ${{ needs.version-ferrastra.outputs.released }}
          FERRASTRA_RELEASE_TAG: ${{ needs.version-ferrastra.outputs.release_tag }}
          QPANE_RELEASED: ${{ needs.version-qpane.outputs.released }}
          QPANE_RELEASE_TAG: ${{ needs.version-qpane.outputs.release_tag }}
          CUTECANVAS_RELEASED: ${{ needs.version-cutecanvas.outputs.released }}
          CUTECANVAS_RELEASE_TAG: ${{ needs.version-cutecanvas.outputs.release_tag }}
        run: python tools/release_publications.py dispatch
