[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0", "setuptools_scm==10.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutecanvas"
dynamic = ["version"]
description = "PySide6 Graphics Editor"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Artificial Sweetener", email = "artificialsweetenerai@proton.me" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Editors",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "ferrastra>=1.0.0,<2.0.0",
  "qpane>=3.0.0,<4.0.0",
  "PySide6>=6.7.3",
  "numpy>=1.21",
  "typing-extensions>=4.0",
]

[project.optional-dependencies]
sam = [
  "torch>=2.1",
  "mobilesam-mirror>=1.0.0",
  "timm>=0.9",
]

[project.urls]
Homepage = "https://artificialsweetener.ai"
Documentation = "https://github.com/Artificial-Sweetener/CuteCanvas/tree/main/packages/cutecanvas/docs"
Repository = "https://github.com/Artificial-Sweetener/CuteCanvas"
Issues = "https://github.com/Artificial-Sweetener/CuteCanvas/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cutecanvas", "cutecanvas.*"]

[tool.setuptools]
package-dir = {"" = "src"}
zip-safe = false

[tool.setuptools.package-data]
cutecanvas = ["*.pyi", "py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "1.0.0"

[tool.setuptools_scm.tag]
regex = "^cutecanvas-v(?P<version>.+)$"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --abbrev=40 --match cutecanvas-v*[0-9]*"

[tool.semantic_release]
assets = ["packages/cutecanvas/pyproject.toml"]
commit_parser = "conventional-monorepo"
commit_message = "chore(cutecanvas): release CuteCanvas {version}\n\nAutomatically generated by python-semantic-release"
logging_use_named_masks = false
tag_format = "cutecanvas-v{version}"
version_toml = []
version_variables = []

[tool.semantic_release.commit_parser_options]
path_filters = ["packages/cutecanvas"]
scope_prefix = "cutecanvas"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "packages/cutecanvas/CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
prerelease_token = "rc"

[tool.pytest.ini_options]
addopts = ["--basetemp=.pytest-tmp"]
pythonpath = ["src", "tests", "examples"]
testpaths = ["tests"]
markers = [
  "interactive_performance: isolate strict interactive latency probes from shared hardware contention",
  "performance: mark long-running performance benchmarks",
  "swap_benchmark: mark swap latency benchmarks",
]
