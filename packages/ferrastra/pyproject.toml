[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "ferrastra"
dynamic = ["version"]
description = "CPU-first typed native graphics product engine"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Artificial Sweetener", email = "artificialsweetenerai@proton.me" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.15"
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.urls]
Homepage = "https://artificialsweetener.ai"
Documentation = "https://github.com/Artificial-Sweetener/CuteCanvas/tree/main/packages/ferrastra/docs"
Repository = "https://github.com/Artificial-Sweetener/CuteCanvas"
Issues = "https://github.com/Artificial-Sweetener/CuteCanvas/issues"

[tool.maturin]
bindings = "pyo3"
manifest-path = "../../crates/ferrastra-python/Cargo.toml"
module-name = "ferrastra._native"
python-source = "src"
strip = false

[tool.semantic_release]
allow_zero_version = true
assets = ["Cargo.lock"]
build_command = "cargo check --workspace --all-features"
commit_parser = "conventional-monorepo"
commit_message = "chore(ferrastra): release Ferrastra {version}\n\nAutomatically generated by python-semantic-release"
logging_use_named_masks = false
tag_format = "ferrastra-v{version}"
version_toml = ["../../Cargo.toml:workspace.package.version"]
version_variables = []

[tool.semantic_release.commit_parser_options]
path_filters = [
  "packages/ferrastra",
  "crates",
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
]
scope_prefix = "ferrastra"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
prerelease_token = "rc"

[tool.pytest.ini_options]
addopts = ["--basetemp=.pytest-tmp"]
pythonpath = ["src", "tests", "examples"]
testpaths = ["tests"]
