[workspace]
members = [
  "crates/ferrastra-core",
  "crates/ferrastra-engine",
  "crates/ferrastra-graph",
  "crates/ferrastra-python",
  "crates/ferrastra-raster",
  "crates/ferrastra-runtime",
  "crates/ferrastra-store",
]
resolver = "3"

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.93.1"
license = "GPL-3.0-or-later"
authors = ["Artificial Sweetener <artificialsweetenerai@proton.me>"]
repository = "https://github.com/Artificial-Sweetener/CuteCanvas"

[workspace.dependencies]
blake3 = "=1.8.7"
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "extension-module"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
missing_safety_doc = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
debug = 1
lto = "thin"

[profile.bench]
debug = 1
lto = "thin"
