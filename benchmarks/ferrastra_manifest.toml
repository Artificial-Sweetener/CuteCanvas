schema_version = 1
stage = 2

[reference_system]
cpu = "Intel Core i9-14900K"
architecture = "x86_64"
operating_system = "Windows 11"
rust_version = "1.93.1"
profile = "bench"

[measurement]
warmup_iterations = 25
sample_iterations = 200
percentiles = [50, 95, 99]
required_metrics = [
  "latency_ms",
  "throughput_per_second",
  "peak_resident_bytes",
  "allocated_bytes",
  "cancellation_latency_ms",
]

[determinism]
fixed_seeds = [0, 1, 18446744073709551615]
thread_counts = [1, 2, 4, 8]
repeated_runs = 3

[[input_classes]]
id = "small"
width = 256
height = 256

[[input_classes]]
id = "viewport"
width = 2048
height = 2048

[[input_classes]]
id = "large"
width = 16384
height = 16384

[registration]
required_operation_fields = [
  "semantic_id",
  "semantic_version",
  "input_products",
  "output_product",
  "demand",
  "damage",
  "memory_budget",
  "cancellation",
  "quality",
  "conformance",
]
require_reference_result = true
require_memory_ceiling = true
require_latency_thresholds = true
require_adversarial_inputs = true

[[registration.operations]]
semantic_id = "ferrastra.resample.lanczos3"
semantic_version = 1
input_products = ["raster.rgba8-premultiplied-encoded"]
output_product = "raster.rgba8-premultiplied-encoded"
demand = "scale-aware three-lobe source support for the exact destination region"
damage = "exact bounded projection for transparent and clamp edges; conservative full projection for periodic edges"
memory_budget = "destination bytes plus bounded coefficient and reusable row scratch"
cancellation = "poll at least once per destination sample with atomic exact publication"
quality = "exact"
conformance = "independent scalar oracle, tile equivalence, strides, edge modes, alpha, working space, and cancellation"
reference_result = "independent direct two-dimensional scalar oracle"
memory_ceiling_bytes = 536870912
cancellation_latency_ms = 5.0
thread_budget = 8
benchmark_cases = [
  "scale-75-percent",
  "scale-50-percent",
  "scale-25-percent",
  "severe-minification",
  "transparent-edges",
  "tile-versus-monolithic",
  "coefficients-cold-versus-reused",
]
adversarial_inputs = [
  "one-pixel-source",
  "checkerboard",
  "premultiplied-transparent-edge",
  "maximum-supported-dimension-planning",
]

[registration.operations.controlled_case]
id = "scale-50-percent"
source_width = 2048
source_height = 2048
destination_width = 1024
destination_height = 1024
edge_mode = "clamp"
working_space = "srgb_linear"
memory_budget_bytes = 536870912
scratch_budget_bytes = 268435456

[registration.operations.latency_thresholds_ms]
p50 = 250.0
p95 = 350.0
p99 = 500.0
